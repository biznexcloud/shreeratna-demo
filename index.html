<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Redirecting...</title>

	<meta http-equiv="refresh" content="3;url=kiti.wpbingosite.com/index.html">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

	<style>
		:root {
			--bg: #f8f8f8;
			--text: #111111;
			--muted: #737373;
			--border: #e5e5e5;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			background: var(--bg);
			font-family: 'Inter', sans-serif;
			color: var(--text);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 32px;
		}

		.container {
			width: 100%;
			max-width: 600px;
			text-align: center;
		}

		.badge {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 10px 16px;
			border: 1px solid var(--border);
			border-radius: 999px;
			background: #fff;
			font-size: 14px;
			font-weight: 500;
			color: #444;
			margin-bottom: 32px;
		}

		.dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #111;
		}

		h1 {
			font-size: clamp(40px, 8vw, 64px);
			line-height: 1;
			letter-spacing: -0.05em;
			font-weight: 600;
			margin-bottom: 16px;
		}

		p {
			color: var(--muted);
			font-size: 16px;
			line-height: 1.8;
			margin-bottom: 40px;
		}

		.progress {
			width: 220px;
			height: 2px;
			background: #e5e5e5;
			margin: 0 auto;
			overflow: hidden;
			border-radius: 999px;
		}

		.progress::after {
			content: '';
			display: block;
			width: 100%;
			height: 100%;
			background: #111;
			transform: translateX(-100%);
			animation: loading 3s linear forwards;
		}

		.manual-link {
			display: inline-block;
			margin-top: 32px;
			color: #666;
			text-decoration: none;
			font-size: 14px;
			transition: 0.2s ease;
		}

		.manual-link:hover {
			color: #111;
		}

		@keyframes loading {
			to {
				transform: translateX(0);
			}
		}
	</style>
</head>

<body>

	<div class="container">

		<div class="badge">
			<span class="dot"></span>
			Secure Connection
		</div>

		<h1>Redirecting</h1>

		<p>
			Taking you to the requested website.
		</p>

		<div class="progress"></div>

		<a href="kiti.wpbingosite.com/index.html" class="manual-link">
			Continue manually →
		</a>

	</div>

</body>

</html>
